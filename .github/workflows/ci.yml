name: CI Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - hml
      - main

defaults:
  run:
    working-directory: datathon-grupo-05

jobs:
  lint:
    name: Lint & Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ hashFiles('datathon-grupo-05/poetry.lock') }}
          restore-keys: poetry-

      - name: Install Poetry
        run: pip install poetry==1.8.2

      - name: Install Linting Dependencies
        run: poetry install --only dev --no-root

      - name: Run Ruff (Linter)
        run: poetry run ruff check .

  test:
    name: Unit Tests & Coverage
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ hashFiles('datathon-grupo-05/poetry.lock') }}
          restore-keys: poetry-

      - name: Install Poetry
        run: pip install poetry==1.8.2

      - name: Install Project Dependencies
        run: poetry install --no-root

      - name: Run Pytest with Coverage
        run: poetry run pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=60

  build-dry-run:
    name: Docker Build Verification
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build custom images only
        working-directory: datathon-grupo-05
        run: docker compose build serving_api airflow
