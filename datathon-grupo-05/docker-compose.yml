version: '3.8'

services:
  # Nossa API Preditiva Corporativa (Serviço de Borda Baseado em FastAPI)
  serving_api:
    build: .
    container_name: datathon_serving_api
    ports:
      - "8000:8000"
    environment:
      - MODEL_ENVIRONMENT=production
      - MLFLOW_TRACKING_URI=http://mlflow_server:5000
    restart: always
    
  # Prometheus Scraper e Monitoramento: Para coletar as métricas/logs do Uvicorn (Supre Gap #01)
  prometheus:
    image: prom/prometheus:latest
    container_name: datathon_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - serving_api
    restart: always

  # Instância Isolada para Registro de MLflow (Supre Gap #05 de Pesos Perdidos)
  mlflow_server:
    image: python:3.11-slim
    container_name: datathon_mlflow
    command: >
      bash -c "pip install mlflow && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db"
    ports:
      - "5000:5000"
    restart: always
