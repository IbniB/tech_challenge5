[tool.poetry]
name = "datathon-grupo-05"
version = "0.1.0"
description = "Tech Challenge Fase 04/05 - MLOps Analytics para Tesouraria"
authors = ["Datathon Grupo 05 <grupo05@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
yfinance = "^0.2.37"
pandas = "^2.2.1"
scikit-learn = "^1.4.1"
dvc = "^3.48.0"
pandera = "^0.18.3"
torch = "^2.2.1"
mlflow = "^2.11.1"
fastapi = "^0.110.0"
uvicorn = "^0.29.0"
prometheus-client = "^0.20.0"
evidently = "^0.4.17"
langchain = "^0.1.13"
langchain-community = "^0.0.38"
langchain-huggingface = "^0.0.3"
transformers = "^4.46.3"
sentence-transformers = "^2.7.0"
accelerate = "^0.29.0"
huggingface-hub = "^0.23.0"
faiss-cpu = "^1.8.0"
ragas = "^0.1.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-cov = "^5.0.0"
ruff = "^0.3.3"
mypy = "^1.9.0"
jupyter = "^1.0.0"
matplotlib = "^3.8.0"
seaborn = "^0.13.0"
statsmodels = "^0.14.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[tool.coverage.run]
omit = [
  "src/models/train.py",
  "src/monitoring/drift.py",
  "src/features/data_collection.py",
  "src/agent/rag_pipeline.py",
  "src/agent/react_agent.py",
  "src/agent/tools.py",
]
